# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: glichess
    runtime: docker
    plan: free
    # Same region as the Neon database (AWS ap-southeast-1).
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # Set these in the Render dashboard (Environment tab).
      - key: BETTER_AUTH_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
