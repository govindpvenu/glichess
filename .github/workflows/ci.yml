name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    # A throwaway Postgres instead of Neon, so CI never touches real data.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: glichess
          POSTGRES_PASSWORD: glichess
          POSTGRES_DB: glichess
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U glichess"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://glichess:glichess@localhost:5432/glichess
      RUN_MIGRATIONS: "true"
      BETTER_AUTH_URL: http://localhost:5173
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      # Google sign-in isn't exercised; the server only requires the variables to be set.
      GOOGLE_CLIENT_ID: ci
      GOOGLE_CLIENT_SECRET: ci
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
